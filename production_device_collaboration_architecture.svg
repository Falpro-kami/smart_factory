<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 700 48px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f334d; }
      .subtitle { font: 400 23px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5d6e84; }
      .panel-title { font: 600 28px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #2b405a; }
      .box-title { font: 600 29px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f334d; }
      .box-text { font: 400 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5b6d84; }
      .small-title { font: 600 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f334d; }
      .label { font: 500 19px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #365f93; }
      .footer { font: 400 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4f6178; }

      .panel { fill: #ffffff; stroke: #d6deea; stroke-width: 1.5; }
      .primary { fill: #edf3fa; stroke: #6685aa; stroke-width: 2.2; }
      .plain { fill: #ffffff; stroke: #9fb0c6; stroke-width: 2; }
      .bus { fill: #e8eef8; stroke: #486a98; stroke-width: 2.4; }
      .device { fill: #fff6ea; stroke: #ad7e42; stroke-width: 2.2; }
      .data { fill: #eff7f2; stroke: #6f967f; stroke-width: 2.2; }

      .arrow { stroke: #365f93; stroke-width: 3.2; fill: none; marker-end: url(#arrowBlue); }
      .feedback { stroke: #4f8367; stroke-width: 3.2; fill: none; marker-end: url(#arrowGreen); }
      .dialog { stroke: #685995; stroke-width: 3; fill: none; marker-start: url(#arrowPurpleStart); marker-end: url(#arrowPurple); stroke-dasharray: 9 7; }
      .divider { stroke: #d6deea; stroke-width: 1.5; }
    </style>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#365f93"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4f8367"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#685995"/>
    </marker>
    <marker id="arrowPurpleStart" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto">
      <path d="M10,2 L2,6 L10,10 Z" fill="#685995"/>
    </marker>
  </defs>

  <rect class="bg" width="1920" height="1080"/>

  <text class="title" x="90" y="98">生产调度与设备智能体协同架构</text>
  <text class="subtitle" x="92" y="140">以生产智能体为入口，调度器统一编排，RocketMQ 解耦通信，设备智能体完成现场执行与反馈</text>

  <!-- Three areas -->
  <rect class="panel" x="80" y="195" width="520" height="660" rx="10"/>
  <rect class="panel" x="700" y="195" width="520" height="660" rx="10"/>
  <rect class="panel" x="1320" y="195" width="520" height="660" rx="10"/>

  <text class="panel-title" x="115" y="245">生产侧</text>
  <text class="panel-title" x="735" y="245">调度与通信</text>
  <text class="panel-title" x="1355" y="245">设备侧</text>

  <!-- Production side -->
  <rect class="primary" x="160" y="290" width="360" height="90" rx="8"/>
  <text class="box-title" x="250" y="345">生产智能体</text>

  <rect class="plain" x="125" y="470" width="120" height="78" rx="6"/>
  <text class="small-title" x="145" y="505">需求理解</text>
  <rect class="plain" x="280" y="470" width="120" height="78" rx="6"/>
  <text class="small-title" x="300" y="505">订单生成</text>
  <rect class="plain" x="435" y="470" width="120" height="78" rx="6"/>
  <text class="small-title" x="455" y="505">工单拆分</text>

  <rect class="data" x="160" y="690" width="360" height="95" rx="8"/>
  <text class="box-title" x="250" y="747">前端展示</text>

  <!-- Center side -->
  <rect class="primary" x="780" y="310" width="360" height="110" rx="8"/>
  <text class="box-title" x="880" y="362">调度器</text>
  <text class="box-text" x="840" y="392">排程、依赖判断、资源协调</text>

  <rect class="bus" x="780" y="610" width="360" height="110" rx="8"/>
  <text class="box-title" x="875" y="662">RocketMQ</text>
  <text class="box-text" x="825" y="692">消息解耦、事件驱动、对话转发</text>

  <!-- Device side -->
  <rect class="device" x="1400" y="310" width="360" height="110" rx="8"/>
  <text class="box-title" x="1485" y="362">设备智能体</text>
  <text class="box-text" x="1455" y="392">理解任务、选择执行流程</text>

  <rect class="device" x="1400" y="610" width="360" height="110" rx="8"/>
  <text class="box-title" x="1500" y="662">设备执行</text>
  <text class="box-text" x="1458" y="692">机器人、AGV、工站等执行单元</text>

  <!-- Production internal flow -->
  <path class="arrow" d="M185 380 V470"/>
  <text class="label" x="205" y="430">业务编排</text>

  <path class="arrow" d="M245 509 H280"/>
  <path class="arrow" d="M400 509 H435"/>

  <!-- Main dispatch flow -->
  <path class="arrow" d="M555 509 L780 365"/>
  <text class="label" x="610" y="430">工单进入调度</text>

  <path class="arrow" d="M960 420 V610"/>
  <text class="label" x="985" y="525">生成下发策略</text>

  <path class="arrow" d="M1140 665 L1400 365"/>
  <text class="label" x="1225" y="500">指令下发</text>

  <path class="arrow" d="M1580 420 V610"/>
  <text class="label" x="1605" y="525">任务执行</text>

  <!-- Feedback flow -->
  <path class="feedback" d="M1400 665 H1140"/>
  <text class="label" x="1215" y="695">状态 / 事件回传</text>

  <path class="feedback" d="M780 665 L520 738"/>
  <text class="label" x="595" y="730">状态同步</text>

  <!-- Natural language dialog, separated from main dispatch -->
  <path class="dialog" d="M520 335 H780"/>
  <text class="label" x="590" y="315">自然语言请求 / 回复</text>

  <path class="dialog" d="M1140 335 H1400"/>
  <text class="label" x="1200" y="315">设备智能体对话</text>

  <!-- Footer -->
  <line class="divider" x1="90" y1="900" x2="1830" y2="900"/>
  <text class="footer" x="90" y="945">核心闭环：生产需求 → 订单与工单生成 → 调度编排 → RocketMQ 解耦通信 → 设备智能体执行 → 状态反馈 → 前端展示</text>
  <text class="footer" x="90" y="985">架构重点：生产侧关注业务决策，调度器关注资源协调，设备侧关注现场执行，三者通过消息总线解耦。</text>
</svg>
